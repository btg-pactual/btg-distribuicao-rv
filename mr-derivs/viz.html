<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr Derivs — Vol &amp; Skew (web)</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    :root {
      --bg: #0a1628;
      --panel: #122238;
      --line: #2a3f5f;
      --text: #e8eef5;
      --muted: #8fa3bc;
      --accent: #00c37a;
      --link: #6eb5ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Segoe UI, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      justify-content: space-between;
    }
    h1 { font-size: 20px; font-weight: 600; margin-top: 6px; }
    .back { color: var(--link); text-decoration: none; font-size: 13px; }
    .back:hover { text-decoration: underline; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 4px; }
    select, input[type="date"] {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 14px;
      min-width: 130px;
    }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button.preset {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    button.preset:hover { border-color: var(--accent); color: var(--text); }
    .meta { font-size: 12px; color: var(--muted); max-width: 360px; line-height: 1.45; }
    main { padding: 16px 20px 32px; max-width: 1200px; margin: 0 auto; }
    .chart {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 14px;
      padding: 8px 4px 4px;
      min-height: 320px;
    }
    .alert {
      background: #3d2a12;
      border: 1px solid #b45309;
      color: #fde68a;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi div {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .kpi span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .kpi strong { font-size: 18px; margin-top: 4px; display: block; }
    .tbl-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px 16px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .tbl-wrap h2 {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--link);
      margin-bottom: 10px;
    }
    table.pct {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.pct th, table.pct td {
      padding: 8px 10px;
      text-align: right;
      border-bottom: 1px solid var(--line);
    }
    table.pct th:first-child, table.pct td:first-child { text-align: left; }
    table.pct th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    table.pct tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <a class="back" href="index.html">← Hub Mr Derivs</a>
      <h1>Vol ATM · Skew · Smile</h1>
    </div>
    <div class="controls">
      <div>
        <label for="ticker">Ativo</label>
        <select id="ticker" aria-label="Ativo"></select>
      </div>
      <div>
        <label for="dIni">De</label>
        <input type="date" id="dIni" />
      </div>
      <div>
        <label for="dFim">Até</label>
        <input type="date" id="dFim" />
      </div>
      <div>
        <label>Atalhos</label>
        <div class="btn-row">
          <button type="button" class="preset" data-days="30">1M</button>
          <button type="button" class="preset" data-days="90">3M</button>
          <button type="button" class="preset" data-days="180">6M</button>
          <button type="button" class="preset" data-days="365">1A</button>
          <button type="button" class="preset" data-days="0">Tudo</button>
        </div>
      </div>
      <p class="meta" id="meta">Carregando manifest…</p>
    </div>
  </header>
  <main>
    <div id="banner" class="alert" hidden></div>
    <div class="kpi" id="kpi"></div>
    <div class="tbl-wrap">
      <h2>Percentis no período selecionado</h2>
      <table class="pct" id="tblPct">
        <thead>
          <tr>
            <th>Variável</th>
            <th>Atual</th>
            <th>Mín</th>
            <th>Máx</th>
            <th>Média</th>
            <th>Percentil</th>
            <th>Dif. média</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="chartVol" class="chart"></div>
    <div id="chartSkew" class="chart"></div>
  </main>
  <script>
    const TICKERS_FALLBACK = [
      "BOVA11", "SMAL11", "PETR4", "EQTL3", "VALE3", "ITUB4", "BPAC11",
      "WEGE3", "BBDC4", "ITSA4", "ABEV3", "B3SA3"
    ];
    const plotLayout = {
      paper_bgcolor: "#122238",
      plot_bgcolor: "#122238",
      font: { color: "#e8eef5", size: 11 },
      margin: { l: 48, r: 24, t: 36, b: 40 },
      xaxis: { gridcolor: "#2a3f5f", zerolinecolor: "#2a3f5f" },
      yaxis: { gridcolor: "#2a3f5f", zerolinecolor: "#2a3f5f" },
      legend: { orientation: "h", y: 1.12 }
    };

    let rawSeries = [];
    let bounds = { inicio: null, fim: null };
    let manifestGlobal = null;

    function pctVol(x) {
      if (x == null || Number.isNaN(x)) return "n/d";
      return (x * 100).toFixed(2) + "%";
    }
    function pctRate(x) {
      if (x == null || Number.isNaN(x)) return "n/d";
      return (x * 100).toFixed(2) + "%";
    }
    function ppDiff(x) {
      if (x == null || Number.isNaN(x)) return "n/d";
      const s = x >= 0 ? "+" : "";
      return s + (x * 100).toFixed(2) + " pp";
    }
    function pctRank(vals, cur) {
      if (cur == null || Number.isNaN(cur) || !vals.length) return null;
      const v = vals.filter(x => x != null && !Number.isNaN(x)).sort((a, b) => a - b);
      if (!v.length) return null;
      let c = 0;
      for (const x of v) if (x <= cur) c++;
      return (c / v.length) * 100;
    }

    function showBanner(msg) {
      const el = document.getElementById("banner");
      el.hidden = false;
      el.textContent = msg;
    }

    function filterSeries() {
      const d0 = document.getElementById("dIni").value;
      const d1 = document.getElementById("dFim").value;
      if (!d0 || !d1) return rawSeries.slice();
      return rawSeries.filter(r => r.refdate >= d0 && r.refdate <= d1);
    }

    function rowStats(series, key, asVol) {
      const vals = series.map(r => r[key]).filter(v => v != null && !Number.isNaN(v));
      const cur = series.length ? series[series.length - 1][key] : null;
      if (!vals.length) {
        return { cur, min: null, max: null, mean: null, pct: null, diff: null };
      }
      const min = Math.min(...vals);
      const max = Math.max(...vals);
      const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
      const pct = pctRank(vals, cur);
      const diff = cur != null ? cur - mean : null;
      const fmt = asVol ? pctVol : pctRate;
      return {
        cur: fmt(cur),
        min: fmt(min),
        max: fmt(max),
        mean: fmt(mean),
        pct: pct != null ? Math.round(pct) + "º" : "n/d",
        diff: asVol ? ppDiff(diff) : ppDiff(diff)
      };
    }

    function renderTable(series) {
      const rows = [
        { label: "Vol ATM", key: "sigma_atm", vol: true },
        { label: "Skew", key: "skew", vol: true },
        { label: "Smile", key: "smile", vol: true }
      ];
      const tbody = document.querySelector("#tblPct tbody");
      tbody.innerHTML = rows.map(r => {
        const s = rowStats(series, r.key, r.vol);
        return `<tr>
          <td>${r.label}</td>
          <td>${s.cur}</td>
          <td>${s.min}</td>
          <td>${s.max}</td>
          <td>${s.mean}</td>
          <td>${s.pct}</td>
          <td>${s.diff}</td>
        </tr>`;
      }).join("");
    }

    function renderCharts(series) {
      if (!series.length) {
        showBanner("Nenhum pregão no período selecionado.");
        Plotly.purge("chartVol");
        Plotly.purge("chartSkew");
        return;
      }
      document.getElementById("banner").hidden = true;
      const last = series[series.length - 1];
      const pctV = pctRank(series.map(r => r.sigma_atm), last.sigma_atm);
      document.getElementById("kpi").innerHTML = `
        <div><span>Vol ATM (fim período)</span><strong>${pctVol(last.sigma_atm)}</strong></div>
        <div><span>Skew</span><strong>${last.skew != null ? pctRate(last.skew) : "n/d"}</strong></div>
        <div><span>Smile</span><strong>${last.smile != null ? pctRate(last.smile) : "n/d"}</strong></div>
        <div><span>Percentil vol</span><strong>${pctV != null ? Math.round(pctV) + "º" : "n/d"}</strong></div>
      `;
      renderTable(series);
      const dates = series.map(r => r.refdate);
      const volTraces = [
        { x: dates, y: series.map(r => r.sigma_atm), name: "Vol ATM FVOL", type: "scatter", mode: "lines", line: { color: "#00c37a" } }
      ];
      if (series.some(r => r.vol_mm != null)) {
        volTraces.push({
          x: dates, y: series.map(r => r.vol_mm), name: "MM 21d", type: "scatter", mode: "lines",
          line: { color: "#6eb5ff", dash: "dot" }
        });
      }
      if (series.some(r => r.vol_realizada != null)) {
        volTraces.push({
          x: dates, y: series.map(r => r.vol_realizada), name: "Realizada", type: "scatter", mode: "lines",
          line: { color: "#fbbf24" }
        });
      }
      Plotly.newPlot("chartVol", volTraces, { ...plotLayout, title: "Vol ATM" }, { responsive: true });
      Plotly.newPlot("chartSkew", [
        { x: dates, y: series.map(r => r.skew), name: "Skew", type: "scatter", mode: "lines", line: { color: "#a78bfa" } },
        { x: dates, y: series.map(r => r.smile), name: "Smile", type: "scatter", mode: "lines", yaxis: "y2", line: { color: "#f472b6" } }
      ], {
        ...plotLayout,
        title: "Skew & smile (FVOL)",
        yaxis: { title: "Skew", gridcolor: "#2a3f5f" },
        yaxis2: { title: "Smile", overlaying: "y", side: "right", gridcolor: "transparent" }
      }, { responsive: true });
    }

    function applyPeriod() {
      const series = filterSeries();
      renderCharts(series);
      const tk = document.getElementById("ticker").value;
      const q = new URLSearchParams(location.search);
      q.set("ticker", tk);
      q.set("from", document.getElementById("dIni").value);
      q.set("to", document.getElementById("dFim").value);
      history.replaceState(null, "", "?" + q.toString());
    }

    function setPreset(days) {
      const fim = bounds.fim || document.getElementById("dFim").value;
      if (!fim) return;
      document.getElementById("dFim").value = fim;
      if (days === 0) {
        document.getElementById("dIni").value = bounds.inicio;
      } else {
        const end = new Date(fim + "T12:00:00");
        end.setDate(end.getDate() - days);
        document.getElementById("dIni").value = end.toISOString().slice(0, 10);
      }
      applyPeriod();
    }

    function setDateBounds(b) {
      bounds = b;
      const dIni = document.getElementById("dIni");
      const dFim = document.getElementById("dFim");
      if (b.inicio) dIni.min = b.inicio;
      if (b.fim) dFim.max = b.fim;
      const params = new URLSearchParams(location.search);
      dFim.value = params.get("to") || b.fim || "";
      dIni.value = params.get("from") || b.inicio || "";
      if (!params.get("from") && b.fim) {
        const end = new Date((b.fim) + "T12:00:00");
        end.setDate(end.getDate() - 90);
        const def = end.toISOString().slice(0, 10);
        if (def >= (b.inicio || "")) dIni.value = def;
      }
    }

    async function loadManifest() {
      try {
        const r = await fetch("data/web/manifest.json");
        if (!r.ok) throw new Error("manifest HTTP " + r.status);
        return await r.json();
      } catch (e) {
        return { tickers: TICKERS_FALLBACK.map(t => ({ ticker: t })) };
      }
    }

    function fillTickerSelect(manifest) {
      manifest = manifest || {};
      manifestGlobal = manifest;
      const sel = document.getElementById("ticker");
      sel.innerHTML = "";
      const fromManifest = (manifest.tickers || []).map(t => t.ticker).filter(Boolean);
      const tickers = fromManifest.length ? fromManifest : TICKERS_FALLBACK;
      tickers.forEach(t => {
        const o = document.createElement("option");
        o.value = t;
        o.textContent = t;
        sel.appendChild(o);
      });
      const params = new URLSearchParams(location.search);
      const q = params.get("ticker");
      if (q && tickers.includes(q)) sel.value = q;
      document.getElementById("meta").textContent = manifest.atualizado_em
        ? `Série até ${manifest.periodo_inicio || "?"} · export ${manifest.atualizado_em}`
        : "Dados: export web (seed 24m)";
    }

    async function loadTicker(ticker) {
      document.getElementById("banner").hidden = true;
      const r = await fetch(`data/web/${ticker}.json`);
      if (!r.ok) {
        showBanner(`Sem dados para ${ticker}. Rode scripts/run_export_web.bat e publique data/web/ no GitHub.`);
        rawSeries = [];
        return;
      }
      const d = await r.json();
      rawSeries = d.series || [];
      const b = d.bounds || {};
      if (!b.inicio && rawSeries.length) {
        b.inicio = rawSeries[0].refdate;
        b.fim = rawSeries[rawSeries.length - 1].refdate;
      }
      const mRow = (manifestGlobal?.tickers || []).find(t => t.ticker === ticker);
      if (mRow?.inicio) b.inicio = mRow.inicio;
      if (mRow?.fim) b.fim = mRow.fim;
      setDateBounds(b);
      applyPeriod();
    }

    (async () => {
      try {
        manifestGlobal = await loadManifest();
        fillTickerSelect(manifestGlobal);
        const sel = document.getElementById("ticker");
        if (!sel.value && sel.options.length) sel.selectedIndex = 0;
        document.getElementById("dIni").addEventListener("change", applyPeriod);
        document.getElementById("dFim").addEventListener("change", applyPeriod);
        document.querySelectorAll("button.preset").forEach(btn => {
          btn.addEventListener("click", () => setPreset(parseInt(btn.dataset.days, 10)));
        });
        sel.addEventListener("change", () => loadTicker(sel.value));
        await loadTicker(sel.value);
      } catch (e) {
        console.error(e);
        showBanner("Erro ao iniciar a página: " + e.message + ". Use Ctrl+F5 ou scripts/run_viz_local.bat.");
      }
    })();
  </script>
</body>
</html>
