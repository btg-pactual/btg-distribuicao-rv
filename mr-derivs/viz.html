<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr Derivs — Vol &amp; Skew (web)</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    :root {
      --bg: #0a1628;
      --panel: #122238;
      --line: #2a3f5f;
      --text: #e8eef5;
      --muted: #8fa3bc;
      --accent: #00c37a;
      --link: #6eb5ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Segoe UI, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 20px; font-weight: 600; }
    .back { color: var(--link); text-decoration: none; font-size: 13px; }
    .back:hover { text-decoration: underline; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 14px;
      min-width: 140px;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.45;
    }
    main { padding: 16px 20px 32px; max-width: 1200px; margin: 0 auto; }
    .chart {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 14px;
      padding: 8px 4px 4px;
      min-height: 320px;
    }
    .alert {
      background: #3d2a12;
      border: 1px solid #b45309;
      color: #fde68a;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi div {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .kpi span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .kpi strong { font-size: 18px; margin-top: 4px; display: block; }
  </style>
</head>
<body>
  <header>
    <div>
      <a class="back" href="index.html">← Hub Mr Derivs</a>
      <h1>Vol ATM · Skew · Smile</h1>
    </div>
    <div class="controls">
      <div>
        <label for="ticker">Ativo</label><br />
        <select id="ticker" aria-label="Ativo"></select>
      </div>
      <p class="meta" id="meta">Carregando manifest…</p>
    </div>
  </header>
  <main>
    <div id="banner" class="alert" hidden></div>
    <div class="kpi" id="kpi"></div>
    <div id="chartVol" class="chart"></div>
    <div id="chartSkew" class="chart"></div>
    <div id="chartSmile" class="chart"></div>
  </main>
  <script>
    const TICKERS_FALLBACK = [
      "BOVA11", "SMAL11", "PETR4", "EQTL3", "VALE3", "ITUB4", "BPAC11",
      "WEGE3", "BBDC4", "ITSA4", "ABEV3", "B3SA3"
    ];
    const plotLayout = {
      paper_bgcolor: "#122238",
      plot_bgcolor: "#122238",
      font: { color: "#e8eef5", size: 11 },
      margin: { l: 48, r: 24, t: 36, b: 40 },
      xaxis: { gridcolor: "#2a3f5f", zerolinecolor: "#2a3f5f" },
      yaxis: { gridcolor: "#2a3f5f", zerolinecolor: "#2a3f5f" },
      legend: { orientation: "h", y: 1.12 }
    };

    function pct(x) {
      if (x == null || Number.isNaN(x)) return "n/d";
      return (x * 100).toFixed(2) + "%";
    }

    function showBanner(msg) {
      const el = document.getElementById("banner");
      el.hidden = false;
      el.textContent = msg;
    }

    async function loadManifest() {
      try {
        const r = await fetch("data/web/manifest.json");
        if (!r.ok) throw new Error("manifest HTTP " + r.status);
        return await r.json();
      } catch (e) {
        return { tickers: TICKERS_FALLBACK.map(t => ({ ticker: t })), periodo_dias: null };
      }
    }

    function fillTickerSelect(manifest) {
      const sel = document.getElementById("ticker");
      sel.innerHTML = "";
      const list = (manifest.tickers || []).map(t => t.ticker || t).filter(Boolean);
      const tickers = list.length ? list : TICKERS_FALLBACK;
      tickers.forEach(t => {
        const o = document.createElement("option");
        o.value = t;
        o.textContent = t;
        sel.appendChild(o);
      });
      const params = new URLSearchParams(location.search);
      const q = params.get("ticker");
      if (q && tickers.includes(q)) sel.value = q;
      document.getElementById("meta").textContent = manifest.atualizado_em
        ? `Dados: ${manifest.periodo_inicio || "?"} → hoje · atualizado ${manifest.atualizado_em}`
        : "Aguardando export (jobs/export_iv_web.R ou GitHub Actions).";
    }

    async function loadTicker(ticker) {
      document.getElementById("banner").hidden = true;
      const r = await fetch(`data/web/${ticker}.json`);
      if (!r.ok) {
        showBanner(
          `Sem dados para ${ticker} no GitHub Pages ainda. Rode jobs/export_iv_web.R (local) ou dispare o workflow Mr Derivs com export web; depois commit em data/web/.`
        );
        Plotly.purge("chartVol");
        Plotly.purge("chartSkew");
        Plotly.purge("chartSmile");
        document.getElementById("kpi").innerHTML = "";
        return;
      }
      const d = await r.json();
      const s = d.series || [];
      if (!s.length) {
        showBanner(`Arquivo ${ticker}.json vazio ou pipeline sem FVOL no periodo.`);
        return;
      }
      const last = s[s.length - 1];
      document.getElementById("kpi").innerHTML = `
        <div><span>Vol ATM (último)</span><strong>${pct(last.sigma_atm)}</strong></div>
        <div><span>Skew FVOL</span><strong>${last.skew != null ? last.skew.toFixed(4) : "n/d"}</strong></div>
        <div><span>Smile FVOL</span><strong>${last.smile != null ? last.smile.toFixed(4) : "n/d"}</strong></div>
        <div><span>Percentil vol</span><strong>${last.pct_vol != null ? last.pct_vol.toFixed(0) + "º" : "n/d"}</strong></div>
      `;
      const dates = s.map(r => r.refdate);
      Plotly.newPlot("chartVol", [
        { x: dates, y: s.map(r => r.sigma_atm), name: "Vol ATM FVOL", type: "scatter", mode: "lines", line: { color: "#00c37a" } },
        { x: dates, y: s.map(r => r.vol_mm), name: "MM 21d", type: "scatter", mode: "lines", line: { color: "#6eb5ff", dash: "dot" } },
        { x: dates, y: s.map(r => r.vol_realizada), name: "Realizada", type: "scatter", mode: "lines", line: { color: "#fbbf24" } }
      ], { ...plotLayout, title: "Vol ATM vs realizada" }, { responsive: true, displayModeBar: true });

      Plotly.newPlot("chartSkew", [
        { x: dates, y: s.map(r => r.skew), name: "Skew", type: "scatter", mode: "lines", line: { color: "#a78bfa" } },
        { x: dates, y: s.map(r => r.smile), name: "Smile", type: "scatter", mode: "lines", yaxis: "y2", line: { color: "#f472b6" } }
      ], {
        ...plotLayout,
        title: "Skew & smile (FVOL)",
        yaxis: { title: "Skew", gridcolor: "#2a3f5f" },
        yaxis2: { title: "Smile", overlaying: "y", side: "right", gridcolor: "transparent" }
      }, { responsive: true });

      const sm = d.smile_ultimo;
      if (sm && sm.points && sm.points.length) {
        const pts = sm.points;
        Plotly.newPlot("chartSmile", [
          { x: pts.map(p => p.sn), y: pts.map(p => p.impvol), name: "IV mkt", mode: "markers+lines", line: { color: "#6eb5ff" } },
          { x: pts.map(p => p.sn), y: pts.map(p => p.fvol_fit), name: "FVOL fit", mode: "lines", line: { color: "#00c37a" } }
        ], { ...plotLayout, title: `Smile último pregão (${sm.refdate})`, xaxis: { title: "sn" }, yaxis: { title: "Vol" } }, { responsive: true });
      } else {
        Plotly.newPlot("chartSmile", [], { ...plotLayout, title: "Smile (sem curva no export)" }, { responsive: true });
      }
    }

    (async () => {
      const manifest = await loadManifest();
      fillTickerSelect(manifest);
      const sel = document.getElementById("ticker");
      const go = () => {
        history.replaceState(null, "", "?ticker=" + encodeURIComponent(sel.value));
        loadTicker(sel.value);
      };
      sel.addEventListener("change", go);
      go();
    })();
  </script>
</body>
</html>
