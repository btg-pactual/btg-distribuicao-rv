name: Mr Derivs COTAHIST diário

on:
  schedule:
    # Dias úteis, 19:00 horário de Brasília (UTC−3)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      seed_24m:
        description: "Forçar janela 24 meses (primeira carga)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: mr-derivs-cotahist
  cancel-in-progress: false

jobs:
  cotahist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pages

      - name: Cache rb3 COTAHIST
        uses: actions/cache@v4
        with:
          path: mr-derivs/.rb3_cache
          key: mr-derivs-rb3-v1
          restore-keys: |
            mr-derivs-rb3-v1

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript mr-derivs/jobs/install_deps.R

      - name: Atualizar COTAHIST
        env:
          MR_DERIVS_RB3_CACHE: ${{ github.workspace }}/mr-derivs/.rb3_cache
          MR_DERIVS_EXPORT_STATUS: "1"
        run: |
          if [ "${{ github.event.inputs.seed_24m }}" = "true" ]; then
            Rscript mr-derivs/jobs/seed_cache_24m.R "${{ github.workspace }}/mr-derivs/.rb3_cache" 24
          else
            Rscript mr-derivs/jobs/atualizar_cache_diario.R "${{ github.workspace }}/mr-derivs/.rb3_cache" || true
          fi
          Rscript mr-derivs/jobs/export_cache_status.R

      - name: Commit status JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mr-derivs/data/cotahist_status.json
          if git diff --staged --quiet; then
            echo "sem mudança em cotahist_status.json"
          else
            git commit -m "Mr Derivs: atualiza status COTAHIST (Actions)."
            git push
          fi
