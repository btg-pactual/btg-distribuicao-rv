name: Mr Derivs COTAHIST diário

on:
  schedule:
    # Dias úteis, 19:00 horário de Brasília (UTC−3)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      seed_24m:
        description: "Forçar janela 24 meses (primeira carga)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      export_web:
        description: "Gerar JSON para o painel (vol/skew no Pages)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: mr-derivs-cotahist
  cancel-in-progress: false

jobs:
  cotahist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pages

      # Chave nova a cada run: actions/cache nao regrava quando a chave ja existe,
      # e o COTAHIST do dia seguinte nunca entrava no cache.
      - name: Restaurar cache rb3
        uses: actions/cache/restore@v4
        with:
          path: mr-derivs/.rb3_cache
          key: mr-derivs-rb3-v2-${{ github.run_id }}
          restore-keys: |
            mr-derivs-rb3-v2-
            mr-derivs-rb3-v1

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpng-dev libjpeg-dev libtiff-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libfribidi-dev \
            cmake pkg-config

      - name: Install R packages
        run: Rscript mr-derivs/jobs/install_deps.R

      - name: Atualizar COTAHIST
        env:
          MR_DERIVS_RB3_CACHE: ${{ github.workspace }}/mr-derivs/.rb3_cache
          MR_DERIVS_EXPORT_STATUS: "1"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.seed_24m }}" = "true" ]; then
            Rscript mr-derivs/jobs/seed_cache_24m.R "${{ github.workspace }}/mr-derivs/.rb3_cache" 24
          else
            Rscript mr-derivs/jobs/atualizar_cache_diario.R "${{ github.workspace }}/mr-derivs/.rb3_cache"
          fi
          Rscript mr-derivs/jobs/export_cache_status.R

      - name: Salvar cache rb3
        if: success()
        uses: actions/cache/save@v4
        with:
          path: mr-derivs/.rb3_cache
          key: mr-derivs-rb3-v2-${{ github.run_id }}

      - name: Publicar JSON do painel
        if: github.event_name == 'schedule' || github.event.inputs.export_web == 'true'
        env:
          MR_DERIVS_RB3_CACHE: ${{ github.workspace }}/mr-derivs/.rb3_cache
          MR_DERIVS_WEB_DIAS: "365"
        run: |
          set -euo pipefail
          Rscript mr-derivs/jobs/export_iv_web.R "${{ github.workspace }}/mr-derivs/.rb3_cache" 365
          Rscript mr-derivs/jobs/export_quant_web.R "${{ github.workspace }}/mr-derivs/.rb3_cache" 365

      - name: Commit status JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mr-derivs/data/cotahist_status.json mr-derivs/data/web/
          if git diff --staged --quiet; then
            echo "sem mudança em cotahist_status.json / data/web"
          else
            git commit -m "Mr Derivs: atualiza status COTAHIST e dados web (Actions)."
            git push
          fi
